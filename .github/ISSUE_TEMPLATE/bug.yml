name: Bug report
description: Something broke or behaved wrong
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got instead. Include the exact error text.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: PancakeSlicer version
      placeholder: v0.4.9
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Windows 11, macOS 15, Ubuntu 24.04…
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: In the desktop app, choose Help › Copy diagnostics and paste here. Self-hosted? Paste the server's recent output.
      placeholder: Paste diagnostics here
    validations:
      required: true
  - type: textarea
    id: files
    attributes:
      label: Model or project
      description: If the problem is tied to a specific model or project, attach it (zip it if GitHub refuses the file type).
