name: Test ARM64 Docker

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        type: string
        required: true
        default: 'v1.0.0-arm64-test'
      publish:
        description: Push Docker images
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

env:
  TAG: ${{ inputs.tag }}
  PUBLISH: ${{ inputs.publish }}
  CMAKE_POLICY_VERSION_MINIMUM: '3.10'
  CMAKE_BUILD_PARALLEL_LEVEL: '4'
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'
  PYTHONUTF8: '1'

jobs:
  engine:
    name: engine linux-arm64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 240
    permissions:
      contents: write
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_COMPILERCHECK: content
      CCACHE_SLOPPINESS: pch_defines,time_macros,include_file_mtime,include_file_ctime
      CCACHE_DEPEND: '1'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Name the prebuilt assets
        id: keys
        run: .github/scripts/build/keys.sh linux-arm64 linux
      - name: Fetch the compiled engine
        id: engine
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rc=0; .github/scripts/build/prebuilt.sh fetch "${{ steps.keys.outputs.engine }}" build-native/tool || rc=$?
          case $rc in 0) echo "hit=true" >> "$GITHUB_OUTPUT" ;; 3) echo "hit=false" >> "$GITHUB_OUTPUT" ;; *) exit $rc ;; esac

      - name: Install build tools (Linux)
        if: steps.engine.outputs.hit == 'false'
        run: |
          .github/scripts/build/apt-install.sh build-essential cmake ninja-build autoconf automake libtool texinfo \
            pkgconf nasm yasm gettext ccache libcurl4-openssl-dev libssl-dev libgl-dev libdbus-1-dev libfontconfig1-dev \
            libfreetype-dev libx11-dev libudev-dev libva-dev libjpeg-turbo8-dev liblzma-dev \
            libxkbcommon-dev libwayland-dev wayland-protocols extra-cmake-modules libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libegl-dev
      - name: Fetch native dependencies
        id: deps
        if: steps.engine.outputs.hit == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rc=0; .github/scripts/build/prebuilt.sh fetch "${{ steps.keys.outputs.deps }}" engine/deps/build || rc=$?
          case $rc in 0) echo "hit=true" >> "$GITHUB_OUTPUT" ;; 3) echo "hit=false" >> "$GITHUB_OUTPUT" ;; *) exit $rc ;; esac
      - name: Build native dependencies
        if: steps.deps.outputs.hit == 'false'
        run: .github/scripts/build/deps.sh linux arm64
      - name: Check and publish native dependencies
        if: steps.deps.outputs.hit == 'false'
        env:
          git_commit_hash: ${{ steps.keys.outputs.source }}
          GH_TOKEN: ${{ github.token }}
        run: |
          .github/scripts/build/engine.sh linux arm64 --configure-only
          .github/scripts/build/prebuilt.sh publish "${{ steps.keys.outputs.deps }}" engine/deps/build OrcaSlicer_dep
      - name: Restore compiler cache
        if: steps.engine.outputs.hit == 'false'
        id: ccache
        uses: actions/cache/restore@v6
        with:
          path: .ccache
          key: ccache-v2-ubuntu-24.04-arm-arm64-${{ github.run_id }}
          restore-keys: ccache-v2-ubuntu-24.04-arm-arm64-
      - name: Build the engine
        if: steps.engine.outputs.hit == 'false'
        env:
          git_commit_hash: ${{ steps.keys.outputs.source }}
        run: .github/scripts/build/engine.sh linux arm64
      - name: Save compiler cache
        if: always() && steps.ccache.outcome == 'success'
        uses: actions/cache/save@v6
        with:
          path: .ccache
          key: ${{ steps.ccache.outputs.cache-primary-key }}
      - name: Publish the compiled engine
        if: steps.engine.outputs.hit == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/build/prebuilt.sh publish "${{ steps.keys.outputs.engine }}" build-native/tool .

  docker-arm64:
    name: Build and push arm64 Docker image
    needs: engine
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            desktop/package-lock.json
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.2'
          cache-dependency-path: server/go.sum
      - name: Name the prebuilt assets
        id: keys
        run: .github/scripts/build/keys.sh linux-arm64 linux
      - name: Fetch the engine and its dependencies
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          .github/scripts/build/prebuilt.sh fetch "${{ steps.keys.outputs.engine }}" build-native/tool
          .github/scripts/build/prebuilt.sh fetch "${{ steps.keys.outputs.deps }}" engine/deps/build
      - name: Build web UI and desktop shell dependencies
        run: |
          npm ci --prefix web
          npm ci --prefix desktop
          if [ "$PUBLISH" = true ]; then
            npm pkg set version="${TAG#v}" --prefix desktop
            npm pkg set version="${TAG#v}" --prefix web
          fi
          npm run build --prefix web
      - name: Bundle engine shared libraries
        run: |
          mkdir -p build-native/tool/lib
          ldd build-native/tool/nonplanar_slice_tool | awk '/=> \// {print $3}' | while read l; do
            case "$(basename "$l")" in libc.so*|libm.so*|libpthread.so*|libdl.so*|librt.so*|ld-linux*) ;; *) cp -L "$l" build-native/tool/lib/ ;; esac
          done
          for l in build-native/tool/lib/*; do patchelf --set-rpath '$ORIGIN' "$l"; done
          patchelf --set-rpath '$ORIGIN/lib' build-native/tool/nonplanar_slice_tool
      - name: Patch stage-ci.py for arm64 (allow staging without Docker/qualification)
        run: |
          sed -i "s/if sys.platform != 'linux' or args.arch != 'x64':/if False:/" desktop/scripts/stage-ci.py
          sed -i "s/if args.os != 'linux' or args.arch != 'x64':/if False:/" desktop/scripts/stage-ci.py
      - name: Stage payload (no Docker/qualification)
        run: |
          python desktop/scripts/stage-ci.py --os linux --arch arm64 --tool build-native/tool/nonplanar_slice_tool \
            --reference desktop/build/reference --engine-source "${{ steps.keys.outputs.source }}"
      - name: Build and test the Docker image
        run: |
          git archive --format=tar.gz -o desktop/build/engine-linux-arm64/source.tar.gz HEAD
          chmod 0644 desktop/build/engine-linux-arm64/source.tar.gz
          printf '**\n!engine-linux-arm64/ \n!engine-linux-arm64/**\n!web/\n!web/**\n' > desktop/build/.dockerignore
          docker build --file deploy/Dockerfile --build-arg VERSION="${TAG#v}" --build-arg REVISION="$GITHUB_SHA" \
            --build-arg SOURCE_SHA256="$(sha256sum desktop/build/engine-linux-arm64/source.tar.gz | cut -d' ' -f1)" \
            --tag pancakeslicer:ci desktop/build
          docker run -d --name test -p 6868:6868 pancakeslicer:ci
          for i in $(seq 30); do curl -fsS http://127.0.0.1:6868/api/healthz && break; sleep 2; done
          sh deploy/test.sh http://127.0.0.1:6868
          docker rm -f test
      - name: Push the Docker image to sabhyaaggarwal GHCR
        if: env.PUBLISH == 'true'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          version="${TAG#v}"
          echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
          for repo in ghcr.io/sabhyaaggarwal/pancakeslicer docker.io/sabhyaaggarwal/pancakeslicer; do
            for t in "$version" latest; do docker tag pancakeslicer:ci "$repo:$t"; docker push "$repo:$t"; done
          done
          docker inspect --format '{{index .RepoDigests 0}}' ghcr.io/sabhyaaggarwal/pancakeslicer:$version
