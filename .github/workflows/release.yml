name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and attach to
        type: string
        required: true
      publish:
        description: Attach installers to the release and push Docker images
        type: boolean
        default: false
      targets:
        description: Space-separated targets (mac-arm64 mac-x64 win-x64 linux-x64 linux-arm64); empty builds all
        type: string
        default: ''
      deps_from_run:
        description: Run ID whose saved dependency prefix to resume from instead of a cold dependency build
        type: string
        default: ''
      deps_targets:
        description: Space-separated deps targets to build on top of the resumed prefix
        type: string
        default: ''
  workflow_call:
    inputs:
      targets:
        type: string
        default: ''

permissions:
  contents: read

env:
  TAG: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.tag || 'v0.0.0-main' }}
  PUBLISH: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) || inputs.publish == true }}
  CMAKE_POLICY_VERSION_MINIMUM: '3.10'
  CMAKE_BUILD_PARALLEL_LEVEL: '4'
  PYTHONUTF8: '1'

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      targets: ${{ steps.select.outputs.targets }}
      tag: ${{ steps.select.outputs.tag }}
      publish: ${{ steps.select.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
      - name: Select targets
        id: select
        env:
          TARGETS: ${{ inputs.targets }}
        run: |
          all="mac-arm64 mac-x64 win-x64 linux-x64 linux-arm64"
          chosen=" "
          for t in ${TARGETS:-$all}; do
            case " $all " in *" $t "*) chosen="$chosen$t " ;; *) echo "::error::unknown target $t"; exit 1 ;; esac
          done
          { echo "targets=$chosen"; echo "tag=$TAG"; echo "publish=$PUBLISH"; } >> "$GITHUB_OUTPUT"
          echo "Targets:$chosen"
      - name: Create the draft release
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --draft --target "$GITHUB_SHA" --title "PancakeSlicer ${TAG#v}" --notes ""
          fi
          source="PancakeSlicer-${TAG#v}-source.tar.gz"
          if ! gh release view "$TAG" --json assets --jq '.assets[].name' | grep -qxF "$source"; then
            git archive --format=tar.gz --prefix="PancakeSlicer-${TAG#v}/" -o "$source" HEAD
            gh release upload "$TAG" "$source"
          fi

  engine-mac-arm64:
    needs: prepare
    if: contains(needs.prepare.outputs.targets, ' mac-arm64 ')
    uses: ./.github/workflows/release-engine.yml
    permissions:
      contents: write
    with:
      target: mac-arm64
      os: mac
      arch: arm64
      runner: macos-15
      deps_from_run: '${{ inputs.deps_from_run }}'
      deps_targets: '${{ inputs.deps_targets }}'

  engine-mac-x64:
    needs: prepare
    if: contains(needs.prepare.outputs.targets, ' mac-x64 ')
    uses: ./.github/workflows/release-engine.yml
    permissions:
      contents: write
    with:
      target: mac-x64
      os: mac
      arch: x64
      runner: macos-15
      deps_from_run: '${{ inputs.deps_from_run }}'
      deps_targets: '${{ inputs.deps_targets }}'

  engine-win-x64:
    needs: prepare
    if: contains(needs.prepare.outputs.targets, ' win-x64 ')
    uses: ./.github/workflows/release-engine.yml
    permissions:
      contents: write
    with:
      target: win-x64
      os: win
      arch: x64
      runner: windows-2025
      deps_from_run: '${{ inputs.deps_from_run }}'
      deps_targets: '${{ inputs.deps_targets }}'

  engine-linux-x64:
    needs: prepare
    if: contains(needs.prepare.outputs.targets, ' linux-x64 ')
    uses: ./.github/workflows/release-engine.yml
    permissions:
      contents: write
    with:
      target: linux-x64
      os: linux
      arch: x64
      runner: ubuntu-24.04
      deps_from_run: '${{ inputs.deps_from_run }}'
      deps_targets: '${{ inputs.deps_targets }}'

  engine-linux-arm64:
    needs: prepare
    if: contains(needs.prepare.outputs.targets, ' linux-arm64 ')
    uses: ./.github/workflows/release-engine.yml
    permissions:
      contents: write
    with:
      target: linux-arm64
      os: linux
      arch: arm64
      runner: ubuntu-24.04-arm
      deps_from_run: '${{ inputs.deps_from_run }}'
      deps_targets: '${{ inputs.deps_targets }}'

  # The Linux x64 qualification every platform is checked against. It is keyed by the engine source, resources and
  # qualifier only, so a packaging change reuses the published one; it is generated only on a miss.
  reference:
    name: Engine reference
    needs: [prepare, engine-linux-x64]
    if: always() && needs.prepare.result == 'success' && needs.engine-linux-x64.result != 'failure' && needs.engine-linux-x64.result != 'cancelled'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Name the prebuilt assets
        id: keys
        run: .github/scripts/build/keys.sh linux-x64 linux
      - name: Fetch the reference
        id: fetch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rc=0; .github/scripts/build/prebuilt.sh fetch "${{ steps.keys.outputs.reference }}" desktop/build/reference || rc=$?
          case $rc in 0) echo "hit=true" >> "$GITHUB_OUTPUT" ;; 3) echo "hit=false" >> "$GITHUB_OUTPUT" ;; *) exit $rc ;; esac
      - uses: actions/setup-node@v6
        if: steps.fetch.outputs.hit == 'false'
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@v6
        if: steps.fetch.outputs.hit == 'false'
        with:
          go-version: '1.27.2'
          cache-dependency-path: server/go.sum
      - uses: actions/setup-python@v6
        if: steps.fetch.outputs.hit == 'false'
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: engine/scripts/qualification/requirements.txt
      - name: Generate the reference
        if: steps.fetch.outputs.hit == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m pip install -r engine/scripts/qualification/requirements.txt
          .github/scripts/build/apt-install.sh patchelf libcurl4-openssl-dev libssl-dev libgl-dev libdbus-1-dev libfontconfig1-dev \
            libfreetype-dev libx11-dev libudev-dev libva-dev libjpeg-turbo8-dev liblzma-dev libxkbcommon-dev libwayland-dev libegl-dev
          .github/scripts/build/prebuilt.sh fetch "${{ steps.keys.outputs.engine }}" build-native/tool
          .github/scripts/build/prebuilt.sh fetch "${{ steps.keys.outputs.deps }}" engine/deps/build
          npm ci --prefix web
          npm run build --prefix web
          mkdir -p build-native/tool/lib
          ldd build-native/tool/nonplanar_slice_tool | awk '/=> \// {print $3}' | while read l; do
            case "$(basename "$l")" in libc.so*|libm.so*|libpthread.so*|libdl.so*|librt.so*|ld-linux*) ;; *) cp -L "$l" build-native/tool/lib/ ;; esac
          done
          for l in build-native/tool/lib/*; do patchelf --set-rpath '$ORIGIN' "$l"; done
          patchelf --set-rpath '$ORIGIN/lib' build-native/tool/nonplanar_slice_tool
          python desktop/scripts/stage-ci.py --os linux --arch x64 --tool build-native/tool/nonplanar_slice_tool \
            --reference desktop/build/reference --engine-source "${{ steps.keys.outputs.source }}" --image "pancakeslicer-check:${GITHUB_SHA::10}"
          .github/scripts/build/prebuilt.sh publish "${{ steps.keys.outputs.reference }}" desktop/build/reference .
      - name: Compare the engine reference with the base
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: .github/scripts/build/compare-reference.sh "$BASE" desktop/build/reference "${{ steps.keys.outputs.reference }}"

  platform-mac-arm64:
    needs: [prepare, engine-mac-arm64, reference]
    if: always() && needs.engine-mac-arm64.result == 'success' && needs.reference.result == 'success'
    uses: ./.github/workflows/release-platform.yml
    permissions:
      contents: write
      packages: write
    secrets: inherit
    with:
      target: mac-arm64
      os: mac
      arch: arm64
      runner: macos-15
      tag: '${{ needs.prepare.outputs.tag }}'
      publish: ${{ needs.prepare.outputs.publish == 'true' }}

  platform-mac-x64:
    needs: [prepare, engine-mac-x64, reference]
    if: always() && needs.engine-mac-x64.result == 'success' && needs.reference.result == 'success'
    uses: ./.github/workflows/release-platform.yml
    permissions:
      contents: write
      packages: write
    secrets: inherit
    with:
      target: mac-x64
      os: mac
      arch: x64
      runner: macos-15
      tag: '${{ needs.prepare.outputs.tag }}'
      publish: ${{ needs.prepare.outputs.publish == 'true' }}

  platform-win-x64:
    needs: [prepare, engine-win-x64, reference]
    if: always() && needs.engine-win-x64.result == 'success' && needs.reference.result == 'success'
    uses: ./.github/workflows/release-platform.yml
    permissions:
      contents: write
      packages: write
    secrets: inherit
    with:
      target: win-x64
      os: win
      arch: x64
      runner: windows-2025
      tag: '${{ needs.prepare.outputs.tag }}'
      publish: ${{ needs.prepare.outputs.publish == 'true' }}

  platform-linux-x64:
    needs: [prepare, engine-linux-x64, reference]
    if: always() && needs.engine-linux-x64.result == 'success' && needs.reference.result == 'success'
    uses: ./.github/workflows/release-platform.yml
    permissions:
      contents: write
      packages: write
    secrets: inherit
    with:
      target: linux-x64
      os: linux
      arch: x64
      runner: ubuntu-24.04
      tag: '${{ needs.prepare.outputs.tag }}'
      publish: ${{ needs.prepare.outputs.publish == 'true' }}

  platform-linux-arm64:
    needs: [prepare, engine-linux-arm64, reference]
    if: always() && needs.engine-linux-arm64.result == 'success' && needs.reference.result == 'success'
    uses: ./.github/workflows/release-platform.yml
    permissions:
      contents: write
      packages: write
    secrets: inherit
    with:
      target: linux-arm64
      os: linux
      arch: arm64
      runner: ubuntu-24.04-arm
      tag: '${{ needs.prepare.outputs.tag }}'
      publish: ${{ needs.prepare.outputs.publish == 'true' }}

  # The only job that makes anything public. It runs after every platform and publishes only when every selected
  # target qualified: then the per-commit images get the version, per-architecture and latest tags and the draft
  # release is published. On any failure it stops before the first tag, so the draft stays a draft.
  gate:
    name: Gate and publish
    needs: [prepare, reference, engine-mac-arm64, engine-mac-x64, engine-win-x64, engine-linux-x64, engine-linux-arm64, platform-mac-arm64, platform-mac-x64, platform-win-x64, platform-linux-x64, platform-linux-arm64]
    if: always() && needs.prepare.result == 'success' && needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Check every selected target finished
        env:
          TARGETS: ${{ needs.prepare.outputs.targets }}
          RESULTS: ${{ toJSON(needs) }}
        run: |
          ok=true
          [ "$(jq -r '.reference.result' <<<"$RESULTS")" = success ] || { echo "::error::reference: $(jq -r '.reference.result' <<<"$RESULTS")"; ok=false; }
          for t in $TARGETS; do
            for job in engine-$t platform-$t; do
              r=$(jq -r --arg j "$job" '.[$j].result' <<<"$RESULTS")
              [ "$r" = success ] || { echo "::error::$job: $r"; ok=false; }
            done
          done
          $ok
      - name: Download the qualification evidence attached to the draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern 'PancakeSlicer-*-qualification.zip' --dir evidence
      - name: Check every selected target's qualification
        env:
          TARGETS: ${{ needs.prepare.outputs.targets }}
        run: |
          ok=true
          for t in $TARGETS; do
            zip=evidence/PancakeSlicer-$t-qualification.zip
            if [ ! -f "$zip" ]; then echo "::error::$t: no qualification evidence"; ok=false; continue; fi
            q=$(unzip -p "$zip" qualification.json)
            echo "$t: ready=$(jq -r .ready <<<"$q") publication=$(jq -r .publication_main_sha <<<"$q")"
            [ "$(jq -r .ready <<<"$q")" = true ] && [ "$(jq -r .publication_main_sha <<<"$q")" = "$GITHUB_SHA" ] || { echo "::error::$t is not qualified for $GITHUB_SHA"; ok=false; }
          done
          $ok
      - name: Tag the Docker images
        env:
          TARGETS: ${{ needs.prepare.outputs.targets }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          version="${TAG#v}" commit="sha-${GITHUB_SHA::10}"
          arches=(); for t in $TARGETS; do case $t in linux-x64) arches+=(amd64) ;; linux-arm64) arches+=(arm64) ;; esac; done
          [ ${#arches[@]} -gt 0 ] || { echo "No Linux target, no images to tag"; exit 0; }
          echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
          for repo in ghcr.io/zimengxiong/pancakeslicer docker.io/zimengxiong/pancakeslicer; do
            images=()
            for arch in "${arches[@]}"; do
              docker buildx imagetools create --tag "$repo:$version-$arch" "$repo:$commit-$arch"
              images+=("$repo:$commit-$arch")
            done
            echo "$repo:$version = ${images[*]}"
            docker buildx imagetools create --tag "$repo:$version" --tag "$repo:latest" "${images[@]}"
          done
          docker buildx imagetools inspect ghcr.io/zimengxiong/pancakeslicer:$version
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq ".[] | select(.tag_name == \"$TAG\") | .id")
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$id" -f body= -F draft=false -f make_latest=true --jq '.html_url'
