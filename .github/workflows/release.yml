name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and attach to
        type: string
        required: true
      publish:
        description: Attach installers to the release and push Docker images
        type: boolean
        default: false
      targets:
        description: Space-separated targets (mac-arm64 mac-x64 win-x64 linux-x64 linux-arm64); empty builds all
        type: string
        default: ''
      deps_from_run:
        description: Run ID whose saved dependency prefix to resume from instead of a cold dependency build
        type: string
        default: ''
      deps_targets:
        description: Space-separated deps targets to build on top of the resumed prefix
        type: string
        default: ''
  workflow_call:
    inputs:
      targets:
        type: string
        default: ''

permissions:
  contents: read

env:
  TAG: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.tag || 'v0.0.0-main' }}
  PUBLISH: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) || inputs.publish == true }}
  CMAKE_POLICY_VERSION_MINIMUM: '3.10'
  CMAKE_BUILD_PARALLEL_LEVEL: '4'
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'
  PYTHONUTF8: '1'

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      all: ${{ steps.matrix.outputs.all }}
      desktop: ${{ steps.matrix.outputs.desktop }}
      linux: ${{ steps.matrix.outputs.linux }}
    steps:
      - uses: actions/checkout@v7
      - name: Select targets
        id: matrix
        env:
          TARGETS: ${{ inputs.targets }}
        run: |
          all='[{"target":"mac-arm64","os":"mac","arch":"arm64","runner":"macos-15"},
                {"target":"mac-x64","os":"mac","arch":"x64","runner":"macos-15"},
                {"target":"win-x64","os":"win","arch":"x64","runner":"windows-2025"},
                {"target":"linux-x64","os":"linux","arch":"x64","runner":"ubuntu-24.04"},
                {"target":"linux-arm64","os":"linux","arch":"arm64","runner":"ubuntu-24.04-arm"}]'
          chosen=$(jq -c --arg t "$TARGETS" '($t | split(" ") | map(select(. != ""))) as $w | map(select(($w | length) == 0 or (.target | IN($w[]))))' <<<"$all")
          echo "all=$chosen" >> "$GITHUB_OUTPUT"
          echo "desktop=$(jq -c 'map(select(.os != "linux"))' <<<"$chosen")" >> "$GITHUB_OUTPUT"
          echo "linux=$(jq -c 'map(select(.os == "linux"))' <<<"$chosen")" >> "$GITHUB_OUTPUT"
      - name: Create the draft release
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --draft --target "$GITHUB_SHA" --title "PancakeSlicer ${TAG#v}" --notes ""
          fi
          source="PancakeSlicer-${TAG#v}-source.tar.gz"
          if ! gh release view "$TAG" --json assets --jq '.assets[].name' | grep -qxF "$source"; then
            git archive --format=tar.gz --prefix="PancakeSlicer-${TAG#v}/" -o "$source" HEAD
            gh release upload "$TAG" "$source"
          fi

  engine:
    name: engine ${{ matrix.target }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.all) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    permissions:
      contents: write
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_COMPILERCHECK: content
      CCACHE_SLOPPINESS: pch_defines,time_macros,include_file_mtime,include_file_ctime
      CCACHE_DEPEND: '1'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Name the prebuilt assets
        id: keys
        run: .github/scripts/build/keys.sh ${{ matrix.target }} ${{ matrix.os }}
      - name: Fetch the compiled engine
        id: engine
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rc=0; .github/scripts/build/prebuilt.sh fetch "${{ steps.keys.outputs.engine }}" build-native/tool || rc=$?
          case $rc in 0) echo "hit=true" >> "$GITHUB_OUTPUT" ;; 3) echo "hit=false" >> "$GITHUB_OUTPUT" ;; *) exit $rc ;; esac

      - name: Install build tools (macOS)
        if: steps.engine.outputs.hit == 'false' && runner.os == 'macOS'
        run: brew install automake texinfo libtool pkgconf nasm ninja xz ccache
      - name: Install build tools (Linux)
        if: steps.engine.outputs.hit == 'false' && runner.os == 'Linux'
        run: |
          .github/scripts/build/apt-install.sh build-essential cmake ninja-build autoconf automake libtool texinfo \
            pkgconf nasm yasm gettext ccache libcurl4-openssl-dev libssl-dev libgl-dev libdbus-1-dev libfontconfig1-dev \
            libfreetype-dev libx11-dev libudev-dev libva-dev libjpeg-turbo8-dev liblzma-dev \
            libxkbcommon-dev libwayland-dev wayland-protocols extra-cmake-modules libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libegl-dev
      - name: Install build tools (Windows)
        if: steps.engine.outputs.hit == 'false' && runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install nasm ninja ccache --no-progress -y
          'C:\Program Files\NASM' >> $env:GITHUB_PATH
      - name: Fetch native dependencies
        id: deps
        if: steps.engine.outputs.hit == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rc=0; .github/scripts/build/prebuilt.sh fetch "${{ steps.keys.outputs.deps }}" engine/deps/build || rc=$?
          case $rc in 0) echo "hit=true" >> "$GITHUB_OUTPUT" ;; 3) echo "hit=false" >> "$GITHUB_OUTPUT" ;; *) exit $rc ;; esac
      - name: Resume the dependency prefix of an earlier run
        id: resume
        if: steps.deps.outputs.hit == 'false' && inputs.deps_from_run != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "${{ inputs.deps_from_run }}" --repo "$GITHUB_REPOSITORY" --name "deps-prefix-${{ matrix.target }}" --dir .
          mkdir -p engine/deps/build && tar -xf deps-prefix.tar -C engine/deps/build && rm deps-prefix.tar
      - name: Build native dependencies
        if: steps.deps.outputs.hit == 'false'
        env:
          DEPS_TARGETS: ${{ inputs.deps_targets }}
        run: |
          if [ "${{ steps.resume.outcome }}" = success ]; then
            source .github/scripts/build/deps-${{ matrix.os }}.sh
            configure ${{ matrix.arch }}
            if [ -n "$DEPS_TARGETS" ]; then cmake --build engine/deps/build --config Release --target $DEPS_TARGETS --parallel 4; fi
          else
            .github/scripts/build/deps.sh ${{ matrix.os }} ${{ matrix.arch }}
          fi
      - name: Check and publish native dependencies
        if: steps.deps.outputs.hit == 'false'
        env:
          CMAKE_APPLE_SILICON_PROCESSOR: ${{ matrix.target == 'mac-x64' && 'x86_64' || '' }}
          git_commit_hash: ${{ steps.keys.outputs.source }}
          GH_TOKEN: ${{ github.token }}
        run: |
          .github/scripts/build/engine.sh ${{ matrix.os }} ${{ matrix.arch }} --configure-only
          .github/scripts/build/prebuilt.sh publish "${{ steps.keys.outputs.deps }}" engine/deps/build OrcaSlicer_dep
      - name: Save the dependency prefix for a resumed run
        if: failure() && steps.deps.outputs.hit == 'false'
        run: tar -cf deps-prefix.tar -C engine/deps/build OrcaSlicer_dep
      - name: Upload the dependency prefix for a resumed run
        if: failure() && steps.deps.outputs.hit == 'false'
        uses: actions/upload-artifact@v7
        with:
          name: deps-prefix-${{ matrix.target }}
          path: deps-prefix.tar
          retention-days: 7
      - name: Restore compiler cache
        if: steps.engine.outputs.hit == 'false'
        id: ccache
        uses: actions/cache/restore@v6
        with:
          path: .ccache
          key: ccache-v2-${{ matrix.runner }}-${{ matrix.arch }}-${{ github.run_id }}
          restore-keys: ccache-v2-${{ matrix.runner }}-${{ matrix.arch }}-
      - name: Build the engine
        if: steps.engine.outputs.hit == 'false'
        env:
          CMAKE_APPLE_SILICON_PROCESSOR: ${{ matrix.target == 'mac-x64' && 'x86_64' || '' }}
          git_commit_hash: ${{ steps.keys.outputs.source }}
        run: .github/scripts/build/engine.sh ${{ matrix.os }} ${{ matrix.arch }}
      - name: Save compiler cache
        if: always() && steps.ccache.outcome == 'success'
        uses: actions/cache/save@v6
        with:
          path: .ccache
          key: ${{ steps.ccache.outputs.cache-primary-key }}
      - name: Publish the compiled engine
        if: steps.engine.outputs.hit == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/build/prebuilt.sh publish "${{ steps.keys.outputs.engine }}" build-native/tool .

  linux:
    name: ${{ matrix.target }} (qualification, installers, Docker)
    needs: [prepare, engine]
    if: needs.prepare.outputs.linux != '[]'
    strategy:
      max-parallel: 1
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.linux) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            desktop/package-lock.json
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.2'
          cache-dependency-path: server/go.sum
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: engine/scripts/qualification/requirements.txt
      - run: python -m pip install -r engine/scripts/qualification/requirements.txt
      - name: Install runtime libraries
        run: |
          .github/scripts/build/apt-install.sh patchelf rpm fakeroot libcurl4-openssl-dev libssl-dev libgl-dev libdbus-1-dev \
            libfontconfig1-dev libfreetype-dev libx11-dev libudev-dev libva-dev libjpeg-turbo8-dev liblzma-dev libxkbcommon-dev \
            libwayland-dev libegl-dev
      - name: Name the prebuilt assets
        id: keys
        run: .github/scripts/build/keys.sh ${{ matrix.target }} linux
      - name: Fetch the engine, its dependencies and the reference
        id: fetch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          .github/scripts/build/prebuilt.sh fetch "${{ steps.keys.outputs.engine }}" build-native/tool
          .github/scripts/build/prebuilt.sh fetch "${{ steps.keys.outputs.deps }}" engine/deps/build
          rc=0; .github/scripts/build/prebuilt.sh fetch "${{ steps.keys.outputs.reference }}" desktop/build/reference || rc=$?
          case $rc in 0) echo "reference=true" >> "$GITHUB_OUTPUT" ;; 3) echo "reference=false" >> "$GITHUB_OUTPUT" ;; *) exit $rc ;; esac
      - name: Build web UI and desktop shell dependencies
        run: |
          npm ci --prefix web
          npm ci --prefix desktop
          if [ "$PUBLISH" = true ]; then
            npm pkg set version="${TAG#v}" --prefix desktop
            npm pkg set version="${TAG#v}" --prefix web
          fi
          npm run build --prefix web
      - name: Bundle engine shared libraries
        run: |
          mkdir -p build-native/tool/lib
          ldd build-native/tool/nonplanar_slice_tool | awk '/=> \// {print $3}' | while read l; do
            case "$(basename "$l")" in libc.so*|libm.so*|libpthread.so*|libdl.so*|librt.so*|ld-linux*) ;; *) cp -L "$l" build-native/tool/lib/ ;; esac
          done
          for l in build-native/tool/lib/*; do patchelf --set-rpath '$ORIGIN' "$l"; done
          patchelf --set-rpath '$ORIGIN/lib' build-native/tool/nonplanar_slice_tool
      - name: Qualify and stage the payload
        run: |
          python desktop/scripts/stage-ci.py --os linux --arch ${{ matrix.arch }} --tool build-native/tool/nonplanar_slice_tool \
            --reference desktop/build/reference --engine-source "${{ steps.keys.outputs.source }}" --image "pancakeslicer-check:${GITHUB_SHA::10}"
      - name: Publish the engine reference
        if: steps.fetch.outputs.reference == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/build/prebuilt.sh publish "${{ steps.keys.outputs.reference }}" desktop/build/reference .
      - name: Compare the engine reference with the base
        if: matrix.arch == 'x64' && (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main'))
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: .github/scripts/build/compare-reference.sh "$BASE" desktop/build/reference "${{ steps.keys.outputs.reference }}"
      - name: Package installers
        run: |
          cp desktop/icon-1024.png desktop/build/icon.png
          cp -a build-native/tool/lib desktop/build/engine-${{ matrix.target }}/lib
          chmod -R a+rX desktop/build/engine-${{ matrix.target }}/lib
          npm run dist:${{ matrix.target }} --prefix desktop
      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: PancakeSlicer-${{ matrix.target }}
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
          path: |
            desktop/dist/*.AppImage
            desktop/dist/*.deb
            desktop/dist/*.tar.gz
            desktop/build/PancakeSlicer-*-qualification.zip
      - name: Attach installers to the release
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/build/attach.sh desktop/dist/*.AppImage desktop/dist/*.deb desktop/dist/*.tar.gz desktop/build/PancakeSlicer-*-qualification.zip
      - name: Build and test the Docker image
        run: |
          engine=engine-${{ matrix.target }}
          git archive --format=tar.gz -o desktop/build/$engine/source.tar.gz HEAD
          chmod 0644 desktop/build/$engine/source.tar.gz
          printf '**\n!%s/\n!%s/**\n!web/\n!web/**\n' $engine $engine > desktop/build/.dockerignore
          docker build --file deploy/Dockerfile --build-arg ENGINE=$engine --build-arg VERSION="${TAG#v}" --build-arg REVISION="$GITHUB_SHA" \
            --build-arg SOURCE_SHA256="$(sha256sum desktop/build/$engine/source.tar.gz | cut -d' ' -f1)" \
            --tag pancakeslicer:ci desktop/build
          docker run -d --name test -p 6868:6868 pancakeslicer:ci
          for i in $(seq 30); do curl -fsS http://127.0.0.1:6868/api/healthz && break; sleep 2; done
          sh deploy/test.sh http://127.0.0.1:6868
          docker rm -f test
      - name: Push the Docker image
        if: env.PUBLISH == 'true'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          tag="${TAG#v}-${{ matrix.arch == 'x64' && 'amd64' || matrix.arch }}"
          echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
          for repo in ghcr.io/zimengxiong/pancakeslicer docker.io/zimengxiong/pancakeslicer; do
            docker tag pancakeslicer:ci "$repo:$tag"; docker push "$repo:$tag"
          done

  docker:
    name: Docker manifest
    needs: [prepare, linux]
    if: >-
      needs.linux.result == 'success' &&
      ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) || inputs.publish == true)
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Point the version and latest at every architecture published for this version
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          version="${TAG#v}"
          echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
          for repo in ghcr.io/zimengxiong/pancakeslicer docker.io/zimengxiong/pancakeslicer; do
            images=()
            for arch in amd64 arm64; do
              if docker buildx imagetools inspect "$repo:$version-$arch" >/dev/null 2>&1; then images+=("$repo:$version-$arch"); fi
            done
            echo "$repo:$version = ${images[*]}"
            docker buildx imagetools create --tag "$repo:$version" --tag "$repo:latest" "${images[@]}"
          done
          docker buildx imagetools inspect ghcr.io/zimengxiong/pancakeslicer:$version

  desktop:
    name: ${{ matrix.target }}
    needs: [prepare, engine, linux]
    if: always() && needs.engine.result == 'success' && (needs.linux.result == 'success' || needs.linux.result == 'skipped') && needs.prepare.outputs.desktop != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.desktop) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            desktop/package-lock.json
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.2'
          cache-dependency-path: server/go.sum
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: engine/scripts/qualification/requirements.txt
      - run: python -m pip install -r engine/scripts/qualification/requirements.txt
      - name: Check Rosetta
        if: matrix.target == 'mac-x64'
        run: arch -x86_64 /usr/bin/true || sudo softwareupdate --install-rosetta --agree-to-license
      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Name the prebuilt assets
        id: keys
        run: .github/scripts/build/keys.sh ${{ matrix.target }} ${{ matrix.os }}
      - name: Fetch the engine, its dependencies and the reference
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          .github/scripts/build/prebuilt.sh fetch "${{ steps.keys.outputs.engine }}" build-native/tool
          .github/scripts/build/prebuilt.sh fetch "${{ steps.keys.outputs.deps }}" engine/deps/build
          .github/scripts/build/prebuilt.sh fetch "${{ steps.keys.outputs.reference }}" desktop/build/reference
      - name: Build web UI and desktop shell dependencies
        run: |
          npm ci --prefix web
          npm ci --prefix desktop
          if [ "$PUBLISH" = true ]; then
            npm pkg set version="${TAG#v}" --prefix desktop
            npm pkg set version="${TAG#v}" --prefix web
          fi
          npm run build --prefix web
      - name: Qualify and stage the payload
        run: |
          suffix=''; [ "${{ matrix.os }}" = win ] && suffix=.exe
          python desktop/scripts/stage-ci.py --os ${{ matrix.os }} --arch ${{ matrix.arch }} \
            --tool "build-native/tool/nonplanar_slice_tool${suffix}" --reference desktop/build/reference \
            --engine-source "${{ steps.keys.outputs.source }}"
      - name: Package installers
        run: |
          if [ "${{ matrix.os }}" = mac ]; then
            sudo sysctl -w kern.maxfiles=524288 kern.maxfilesperproc=262144
            ulimit -n 262144
          fi
          cp desktop/icon-1024.png desktop/build/icon.png
          case "${{ matrix.target }}" in
            mac-x64) npm run dist:mac-x64 --prefix desktop ;;
            *) npm run dist:${{ matrix.os }} --prefix desktop ;;
          esac
      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: PancakeSlicer-${{ matrix.target }}
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.exe
            desktop/dist/*.zip
            desktop/build/PancakeSlicer-*-qualification.zip
      - name: Attach installers to the release
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/build/attach.sh desktop/dist/*.dmg desktop/dist/*.exe desktop/dist/*.zip desktop/build/PancakeSlicer-*-qualification.zip

  publish:
    name: Publish the release
    needs: [prepare, engine, linux, docker, desktop]
    if: >-
      always() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') &&
      ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) || inputs.publish == true)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq ".[] | select(.tag_name == \"$TAG\") | .id")
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$id" -f body= -F draft=false -f make_latest=true --jq '.html_url'
