name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
      - 'deploy/docker-compose*.yml'
      - 'deploy/caddy/**'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
      - 'deploy/docker-compose*.yml'
      - 'deploy/caddy/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      web: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.web == 'true' }}
      server: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.server == 'true' }}
      desktop: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.desktop == 'true' }}
      engine: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.engine == 'true' || steps.filter.outputs.pipeline == 'true' }}
      nix: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.nix == 'true' }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          predicate-quantifier: every
          filters: |
            web:
              - 'web/**'
              - '!**/*.md'
            server:
              - 'server/**'
              - '!**/*.md'
            desktop:
              - 'desktop/**'
              - '!**/*.md'
            engine:
              - 'engine/**'
              - '!**/*.md'
            pipeline:
              - '{.github/workflows/release.yml,.github/scripts/build/**,desktop/scripts/stage-ci.py,deploy/Dockerfile,deploy/test.sh,server/Dockerfile}'
            nix:
              - 'flake.nix'
              - 'flake.lock'
              - 'pkgs/**'
              - '.github/workflows/ci.yml'

  nix:
    name: Nix flake (evaluation and packages)
    needs: changes
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.nix == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - run: nix flake check --no-build --all-systems
      - run: nix build .#server .#web --no-link

  web:
    name: Web (tsc + build)
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web
      - run: npm run build --prefix web

  server:
    name: Service (go vet + test)
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.2'
          cache-dependency-path: server/go.sum
      - working-directory: server
        run: |
          go vet -mod=vendor ./...
          go test -mod=vendor -count=1 ./...

  desktop:
    name: Desktop shell (tsc)
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci --prefix desktop
      - run: npm run compile --prefix desktop

  engine:
    name: Engine, qualification and Docker (Linux)
    needs: changes
    if: needs.changes.outputs.engine == 'true'
    uses: ./.github/workflows/release.yml
    permissions:
      contents: write
      packages: write
    with:
      targets: linux-x64
