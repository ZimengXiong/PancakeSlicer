# PancakeSlicer: web UI, service and slicing engine in one container.
#   docker compose -f deploy/docker-compose.yml up -d
# Then open http://<host>:6868.
name: pancakeslicer
services:
  pancakeslicer:
    image: zimengxiong/pancakeslicer:latest
    container_name: pancakeslicer
    restart: unless-stopped
    ports:
      - "6868:6868"
    environment:
      ORCA_WEB_MAX_JOBS: "2"                 # slices running at once; more queue
      ORCA_WEB_PRINTER_NETWORK: lan           # lan | off | comma-separated CIDRs/host names
      PANCAKE_STAGE_CACHE_MAX_MB: "1024"      # engine stage cache cap (disposable)
      # ORCA_WEB_BEARER_TOKEN: change-me      # require a token for changes (recommended if exposed)
    volumes:
      - pancakeslicer-data:/data              # projects, profiles, printers, preferences, jobs
      # - pancakeslicer-cache:/data/jobs/stage-cache   # optional: keep the disposable cache out of backups
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 8g

volumes:
  pancakeslicer-data:
  # pancakeslicer-cache:
