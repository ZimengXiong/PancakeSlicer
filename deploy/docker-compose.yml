# PancakeSlicer: web UI, service and slicing engine in one container.
#   docker compose -f deploy/docker-compose.yml up -d
# Then open http://\<host\>:6868.
name: pancakeslicer
services:
  pancakeslicer:
    image: ghcr.io/sabhyaaggarwal/pancakeslicer:latest
    container_name: pancakeslicer
    restart: unless-stopped
    ports:
      - "6868:6868"
    environment:
      ORCA_WEB_MAX_JOBS: "2"
      ORCA_WEB_PRINTER_NETWORK: lan
      PANCAKE_STAGE_CACHE_MAX_MB: "1024"
    volumes:
      - pancakeslicer-data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 8g

volumes:
  pancakeslicer-data:
